    <!-- Extension Compatibility & Fetch Setter Polyfill -->
    <script>
      (function() {
        try {
          var _fetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _fetch;
            },
            set: function(fn) {
              _fetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If already defined or cannot redefine, continue safely
        }

        // Prevent external extension interceptor errors from breaking page lifecycle
        window.addEventListener('error', function(event) {
          if (
            event &&
            event.message &&
            typeof event.message === 'string' &&
            event.message.indexOf('Cannot set property fetch') !== -1
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
